<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Salary Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="intro">
      <h2>Employee Monthly Salary Calculator</h2>
      <h4>
        Calculates net salary considering EPF and tax deductions on both monthly
        salary and lump-sum payments.
      </h4>
    </div>

    <script src="app.js" defer></script>
    <form action="inputs" id="my-form">
      <div class="form-group">
        <label for="Salary">Monthly basic salary</label>
        <input
          type="text"
          class="numeric-only"
          id="basic-salary"
          maxlength="12"
          min="0"
          required
        />
      </div>
      <div class="form-group">
        <label for="Salary">Allowances</label>
        <input
          type="text"
          class="numeric-only"
          id="allowance"
          min="0"
          maxlength="12"
        />
      </div>
      <div class="form-group">
        <label for="Salary">Contributions(societies/clubs/welfare) </label>
        <input
          type="text"
          class="numeric-only"
          id="welfare"
          min="0"
          maxlength="12"
          size="12"
        />
      </div>
      <div class="form-group">
        <label for="confirmation">Lump sum payment eligibility</label>
        <select name="confirmation" id="confirmation">
          <option value="yes">Yes</option>
          <option value="no" selected>No</option>
        </select>
      </div>
      <div id="hidden-input" class="hidden">
        <label for="Salary">Lump sum amount </label>
        <input
          type="text"
          class="numeric-only"
          id="lumpsum"
          min="0"
          maxlength="12"
        />
      </div>
      <div class="button-row">
        <button type="button" id="calulate">Calculate</button>
        <button type="reset" id="reset">Reset</button>
      </div>
      <div id="payslip"></div>
    </form>
    <script type="module" src="./program/main.js"></script>
  </body>
</html>
